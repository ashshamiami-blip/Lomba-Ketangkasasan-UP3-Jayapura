<script>

function ensureL(){const a=allowL();if(a.length&&!a.some(l=>l.id===S.lomba))S.lomba=a[0].id}
async function pull(){try{const t0=Date.now(),j=await API.get(),t1=Date.now();if(j.now)S.off=j.now-(t0+t1)/2;S.scores=j.scores||{};const first=!S.dloaded;S.dloaded=1;S.drafts=j.drafts||{};mergeT(j.timers);S.mode='terhubung server';onScores();onDrafts(first);onTimers()}catch(e){S.mode='server gagal';const m=$('#mode');if(m)m.textContent=S.mode}}
async function initDb(){if(!API.on()){S.mode='lokal';S.scores=ld('scores',{});S.timers=ld('tmrs',{});onScores();return}
  S.col=true;S.dcol=true;await pull();(function tl(){setTimeout(async()=>{if(!document.hidden&&S.tab==='nilai'&&authOk()&&!S.busy)await pullT();tl()},tmGet(tmKey())?2500:4000)})();(function loop(){setTimeout(async()=>{if(!document.hidden&&!S.busy)await pull();loop()},S.tab==='live'?2500:7000)})()}
async function syncJuri(){if(!S.col||!S.prof.name)return;try{await API.set('juri',slug(S.prof.name),{name:S.prof.name,role:S.prof.role,foto:S.prof.foto,ttd:S.prof.ttd,ts:S.prof.ts});S.prof.synced=1;sv('profil',S.prof)}catch(e){}}
function onScores(){const b=$('#mode');if(b)b.textContent=S.mode;const lu=$('#lu');if(lu)lu.textContent=new Date().toLocaleTimeString('id-ID');if(S.tab==='live'&&sigLive()!==S.lsig)renderLive();if(S.tab==='nilai'&&!S.busy)fillMitra()}

function nav(){$('#nav').innerHTML=[['nilai','📝','Nilai'],['live','🏆','Live Score'],['profil','👤','Profil Juri']].map(([k,i,t])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}"><b>${i}</b>${t}</button>`).join('')}
function picker(){return `<div class="chips">${allowL().map(l=>`<button class="chip ${l.id===S.lomba?'on':''}" data-lomba="${l.id}">${esc(l.short)}</button>`).join('')}</div>
<div class="card"><b>${esc(LB[S.lomba].nama)}</b><div class="mut">Batas waktu ${LB[S.lomba].batas} menit</div><label>Mitra yang dinilai</label><select id="mitra"></select><div class="mut" style="margin-top:4px">✓ sudah dikirim · ✎ draf belum dikirim (bisa dilanjutkan)</div></div>`}
function fillMitra(){const s=$('#mitra');if(!s)return;s.innerHTML=CONFIG.mitra.map((m,i)=>`<option value="${i}" ${i===S.mitra?'selected':''}>${i+1}. ${esc(m)}${mark(i)}</option>`).join('')}
function render(){document.body.dataset.v=S.tab;if(S.tab!=='live')S.liveSeen=false;nav();({nilai:renderNilai,live:renderLive,profil:renderProfil})[S.tab]()}

  return s+'</svg>';
}

async function pact(a){

    let v=$('#vid');if(!v){const o=$('#fimg');v=document.createElement('video');v.id='vid';v.setAttribute('playsinline','');v.muted=true;o.replaceWith(v);const i=document.createElement('img');i.id='fimg';i.className='foto';i.style.display='none';v.after(i)}

    c.getContext('2d').drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,320,320);const x=c.getContext('2d');x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,296,320,24);x.fillStyle='#fff';x.font='13px sans-serif';x.fillText(new Date().toLocaleString('id-ID'),8,313);
    S.foto=c.toDataURL('image/jpeg',.65);const im=$('#fimg');im.src=S.foto;im.style.display='block';v.style.display='none';stopCam();$('#snap').style.display='none'}
  if(a==='clr'){const cv=$('#pad');cv.getContext('2d').clearRect(0,0,600,300);S.sig=false}
  if(a==='save'){const AU=API.on(),n=AU?S.prof.name:$('#jn').value.trim();if(!n)return alert('Isi nama juri.');const foto=S.foto||S.prof.foto;if(!foto)return alert('Ambil foto wajah dengan kamera.');if(!S.sig)return alert('Tanda tangan dulu.');const role=AU?S.prof.role:(S.prof.role&&Object.values(S.scores).some(s=>s.judge===slug(S.prof.name))?S.prof.role:S.roleSel);if(!role)return alert('Pilih jenis juri: Juri K3 atau Juri Teknis.');
    S.prof={...S.prof,name:n,role,foto,ttd:$('#pad').toDataURL('image/png'),ts:Date.now(),synced:0};sv('profil',S.prof);S.foto=null;syncJuri();const perlu=API.on()&&!(S.prof.lomba||[]).length;alert(perlu?'Profil juri tersimpan. Sekarang pilih lomba yang akan Anda nilai.':'Profil juri tersimpan.');S.tab=perlu?'profil':'nilai';render()}}
async function send(){if(S.pv)return alert('Mode pratinjau admin: nilai contoh tidak dikirim atau disimpan.');const c=calc(),p=S.prof;
