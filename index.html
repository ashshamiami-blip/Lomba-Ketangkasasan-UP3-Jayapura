<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

  for(const k of ['ded','miss','notes'])S.d[k]=S.d[k]||{}}

  if(S.col&&S.dcol&&S.prof.name){clearTimeout(dt);const ex=S.scores[id],snap={...S.d,judge:slug(S.prof.name),judgeName:S.prof.name,role:S.prof.role,lomba:S.lomba,mitra:S.mitra,same:!!(ex&&norm(ex)===norm(S.d))};dt=setTimeout(()=>API.set('drafts',id,snap).catch(()=>{}),350)}}

const ROLES={k3:{n:'Juri K3',i:'🦺',d:'Menilai sisi K3, keselamatan, dan APD'},teknis:{n:'Juri Teknis',i:'🔧',d:'Menilai sisi pekerjaan teknis'}};

function calc(lb=S.lomba,d=S.d,role=S.prof.role){
  const rub=RUBRIK[lb],cat={},pts={};

function docNet(doc){const d={waktu:doc.waktu,miss:Array.isArray(doc.miss)?Object.fromEntries(doc.miss.map(k=>[k,1])):(doc.miss||{}),ded:doc.ded||{},fatal:doc.fatal||'Tidak',khusus:doc.khusus||0};

function lombaCalc(docs){

  const av=a=>a.reduce((p,q)=>p+q,0)/a.length;
  const k3=K.length?av(K.map(n=>Math.max(0,n.raw-n.kh))):null,k3f=K.some(n=>n.fatal);

const head=()=>`<header class="top"><div class="logos"><img src="${LOGO_PLN}" alt="PLN"><img src="${LOGO_JAGOAN}" alt="Jagoan Jayapura"></div><div class="ttl"><h1>Penilaian Lomba Distribusi</h1><span class="badge" id="mode">${S.mode}</span></div></header>`;
function nav(){$('#nav').innerHTML=[['nilai','📝','Nilai'],['live','🏆','Live Score'],['profil','👤','Profil Juri']].map(([k,i,t])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}"><b>${i}</b>${t}</button>`).join('')}
function picker(){return `<div class="chips">${allowL().map(l=>`<button class="chip ${l.id===S.lomba?'on':''}" data-lomba="${l.id}">${esc(l.short)}</button>`).join('')}</div>
<div class="card"><b>${esc(LB[S.lomba].nama)}</b><div class="mut">Batas waktu ${LB[S.lomba].batas} menit</div><label>Mitra yang dinilai</label><select id="mitra"></select><div class="mut" style="margin-top:4px">✓ sudah dikirim · ✎ draf belum dikirim (bisa dilanjutkan)</div></div>`}
function fillMitra(){const s=$('#mitra');if(!s)return;s.innerHTML=CONFIG.mitra.map((m,i)=>`<option value="${i}" ${i===S.mitra?'selected':''}>${i+1}. ${esc(m)}${mark(i)}</option>`).join('')}
function render(){document.body.dataset.v=S.tab;if(S.tab!=='live')S.liveSeen=false;nav();({nilai:renderNilai,live:renderLive,profil:renderProfil})[S.tab]()}
function renderNilai(){
  stopCam();ensureL();const role=S.prof.role;
  if(!authOk()){$('#app').innerHTML=head()+`<div class="card"><h2>Masuk dulu</h2><p class="mut">Penilaian hanya untuk juri yang punya akun (dibuat oleh admin/pengawas). Live Score tetap bisa dilihat siapa saja. Masuk lewat menu Profil Juri.</p><button data-tab="profil" style="width:100%">Buka Profil Juri</button></div>`;return}
  if(API.on()&&!allowL().length){$('#app').innerHTML=head()+`<div class="card"><h2>Belum ada tugas lomba</h2><p class="mut">Akun Anda belum ditugaskan ke lomba mana pun. Hubungi admin/pengawas.</p></div>`;return}
  if(!role){$('#app').innerHTML=head()+`<div class="card"><h2>Pilih jenis juri dulu</h2><p class="mut">Sebelum menilai, tentukan apakah Anda <b>Juri K3</b> atau <b>Juri Teknis</b> di menu Profil Juri. Juri K3 hanya menilai K3, keselamatan, dan APD; Juri Teknis hanya menilai sisi teknis.</p><button data-tab="profil" style="width:100%">Buka Profil Juri</button></div>`;return}
  openDraft();const rub=RUBRIK[S.lomba],d=S.d,own=r=>ownR(r,role),asps=[...new Set(rub.filter(own).map(r=>r.a))],R=ROLES[role];
  const sent=S.scores[docId()];
  let h=head()+swCard(role)+(S.prof.name&&S.prof.foto&&S.prof.ttd?'':`<div class="warnbox">Lengkapi <b>Profil Juri</b> (nama, foto kamera, tanda tangan) sebelum mengirim nilai.</div>`);
  h+=`<div class="nl-top"><div>${picker()}</div><div><div class="card rolecard"><div class="row"><b style="font-size:17px">${R.i} ${R.n}</b><span class="fix mut">bobot ${f2(wRole(role))} dari 100</span></div><div class="mut">${R.d}. ${role==='k3'?'Nilai K3 Anda otomatis ditambahkan ke nilai setiap juri teknis. Waktu dan aspek teknis tidak perlu diisi.':'Nilai K3 diambil otomatis dari Juri K3 dan digabung ke nilai Anda, sehingga total tetap 100. Aspek K3 tidak perlu diisi.'}</div></div>`
   +(role==='teknis'?`<div class="card"><label style="margin-top:0">Waktu penyelesaian aktual (menit)</label><input data-f="waktu" type="number" inputmode="decimal" step="0.01" value="${esc(d.waktu)}"></div>`:'')+`</div></div>`;
  const bl=[],cks=[...new Set(items(S.lomba).filter(c=>ownC(c.k,role)).map(c=>c.k))];
  let b0=`<details class="as"><summary><span>${role==='k3'?'Checklist APD & alat pengaman':'Checklist alat kerja & material'}</span><span class="sc" id="ckSum"></span></summary>`;
  cks.forEach(k=>{b0+=`<div class="sub"><h3>${esc(k)}</h3>`+items(S.lomba).filter(c=>c.k===k).map(c=>`<div class="ci"><div>${esc(c.n)}${c.q>1?' ×'+c.q:''}<br><small>${esc(c.s)}</small></div><div class="seg" data-chk="${esc(c.n)}"><button class="y ${d.miss[c.n]?'':'on'}" data-v="0">Ada</button><button class="n ${d.miss[c.n]?'on':''}" data-v="1">Tidak ada</button></div></div>`).join('')+'</div>'});
  bl.push(b0+'</details>');
  asps.forEach((a,ai)=>{let b=`<details class="as" ${ai===0?'open':''}><summary><span>${esc(a)}</span><span class="sc" id="as${ai}"></span></summary>`;
    rub.forEach((r,i)=>{if(r.a!==a||!own(r))return;const mk=CONFIG.mapKategori[r.s];
      b+=`<div class="sub"><div class="row"><h3>${esc(r.s)}</h3><span class="fix mut">bobot ${f2(r.b)}</span></div><p>${esc(r.k)}</p><p><b>Ketentuan pengurangan:</b> ${esc(fixP(r.p))}</p>`;
      if(r.auto)b+=`<p>Skor otomatis dari waktu aktual: <span class="sc" id="sk${i}"></span></p>`;
      else{if(mk)b+=`<p class="ok">Otomatis dari checklist (${esc(mk)}): <b id="ck${i}">0</b> poin. Tambahan manual:</p>`;

  A.axes.forEach((a,k)=>{const[x,y]=P(1,k),[lx,ly]=P(1.2,k);s+=`<line x1="150" y1="150" x2="${x}" y2="${y}" stroke="var(--line)"/><text x="${lx}" y="${ly}" fill="var(--ink)" font-size="12" text-anchor="${lx<140?'end':lx>160?'start':'middle'}" dominant-baseline="middle">${esc(AX[a])} ${A.all[k]===null?'':Math.round(A.all[k]*100)+'%'}</text>`});
  A.per.forEach((v,i)=>{if(v.some(x=>x!==null))s+=poly(v,`fill="none" stroke="${COL[i]}" stroke-width="1.5" stroke-dasharray="4 3"`)});
  s+=poly(A.all,'fill="var(--brand)" fill-opacity=".25" stroke="var(--brand)" stroke-width="2.5"');
  A.all.forEach((p,k)=>{const[x,y]=P(p||0,k);s+=`<circle cx="${x}" cy="${y}" r="3.5" fill="var(--brand)"/>`});
  return s+'</svg>';
}
function renderDetail(){
  const mi=S.detail,A=analyze(mi),ls=CONFIG.lombas;

  <div class="card"><h3>Sisi dominan</h3>${top.map(([a,p])=>`<div><b class="ok">${Math.round(p*100)}%</b> ${esc(nA(a))}</div>`).join('')}</div>
  <div class="card"><h3>Perlu ditingkatkan</h3>${low.map(([a,p])=>`<p style="margin:6px 0"><b class="bad">${Math.round(p*100)}%</b> <b>${esc(nA(a))}</b><br><span class="mut">${esc(SARAN[nA(a)]||'')}</span></p>`).join('')}
  ${A.subs.length?`<h3 style="margin-top:10px">Sub aspek paling banyak kehilangan poin</h3>${A.subs.map(u=>`<div class="ci"><div>${esc(u.s)}<br><small>${esc(AX[nA(u.a)])}</small></div><b class="bad">−${f2(u.lost)} / ${f2(u.b)}</b></div>`).join('')}`:''}
  ${A.miss.length?`<h3 style="margin-top:10px">Alat/APD sering tidak lengkap</h3>${A.miss.map(([k,n])=>`<div class="ci"><div>${esc(k)}</div><b>${n}×</b></div>`).join('')}`:''}</div>`;

let stream;const stopCam=()=>{stream&&stream.getTracks().forEach(t=>t.stop());stream=null};
function renderProfil(){const p=S.prof,AU=API.on();S.roleSel=S.roleSel||p.role||'';if(AU&&!authOk())return renderLogin();

  <label>Foto wajah (wajib ambil langsung dari kamera)</label>${p.foto?`<img class="foto" id="fimg" src="${p.foto}">`:'<video id="vid" playsinline muted style="display:none"></video><img class="foto" id="fimg" style="display:none">'}

  <p class="mut" id="cmsg"></p></div><div class="pfR"><label>Tanda tangan digital</label><canvas class="pad" id="pad" width="600" height="300"></canvas>

  const cv=$('#pad'),cx=cv.getContext('2d');cx.lineWidth=5;cx.lineCap='round';cx.strokeStyle='#10222e';
  if(p.ttd){const im=new Image();im.onload=()=>cx.drawImage(im,0,0,600,300);im.src=p.ttd}
  let dn=false;const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*300/r.height]};
  cv.onpointerdown=e=>{dn=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+.1,y+.1);cx.stroke();S.sig=true};
  cv.onpointermove=e=>{if(!dn)return;const[x,y]=pt(e);cx.lineTo(x,y);cx.stroke()};cv.onpointerup=cv.onpointercancel=()=>dn=false;S.sig=!!p.ttd}
function renderLogin(){stopCam();$('#app').innerHTML=head()+`<div class="card" style="max-width:520px;margin:0 auto"><h2>Masuk juri</h2><p class="mut">Akun juri (K3 / Teknis) dibuat oleh admin atau pengawas. Tanpa akun Anda tetap bisa melihat Live Score, tetapi tidak bisa menilai.</p><label>Nama (sesuai akun)</label><input id="lu_n" autocomplete="off"><label>PIN</label><input id="lu_p" type="password" inputmode="numeric" autocomplete="off"><button class="ok" data-p="login" style="width:100%;margin-top:10px">Masuk</button></div><button class="sec" data-act="admin" style="width:100%;margin-top:10px;max-width:520px;display:block;margin-left:auto;margin-right:auto">🔒 Admin / Pengawas</button>`}
async function pact(a){
  if(a==='login'){const n=($('#lu_n').value||'').trim(),pin=($('#lu_p').value||'').trim();if(!n||!pin)return alert('Isi nama dan PIN.');
    try{const j=await API.post({op:'login',name:n,pin});const u=j.user,old=S.prof.id===u.id?S.prof:{};S.prof={id:u.id,name:u.name,role:u.role,lomba:u.lomba,token:j.token,exp:j.exp,foto:old.foto,ttd:old.ttd,ts:old.ts};sv('profil',S.prof);S.roleSel=u.role;render()}catch(e){alert(e.message||'Gagal masuk')}return}
  if(a==='logout'){if(!confirm('Keluar dari akun ini? Foto dan tanda tangan di HP ini ikut dihapus.'))return;S.prof={};rm('profil');S.tab='profil';render();return}
  const msg=$('#cmsg');
  if(a==='cam'){try{stopCam();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    let v=$('#vid');if(!v){const o=$('#fimg');v=document.createElement('video');v.id='vid';v.setAttribute('playsinline','');v.muted=true;o.replaceWith(v);const i=document.createElement('img');i.id='fimg';i.className='foto';i.style.display='none';v.after(i)}
    v.srcObject=stream;v.style.display='block';$('#fimg').style.display='none';await v.play();$('#snap').style.display='block';msg.textContent=''}
    catch(e){msg.innerHTML='<span class="bad">Kamera tidak bisa dibuka. Izinkan akses kamera di browser (foto dari galeri tidak diperbolehkan).</span>'}}
  if(a==='snap'){const v=$('#vid');if(!v||!v.videoWidth)return;const c=document.createElement('canvas');c.width=c.height=320;const s=Math.min(v.videoWidth,v.videoHeight);
    c.getContext('2d').drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,320,320);const x=c.getContext('2d');x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,296,320,24);x.fillStyle='#fff';x.font='13px sans-serif';x.fillText(new Date().toLocaleString('id-ID'),8,313);
    S.foto=c.toDataURL('image/jpeg',.65);const im=$('#fimg');im.src=S.foto;im.style.display='block';v.style.display='none';stopCam();$('#snap').style.display='none'}
  if(a==='clr'){const cv=$('#pad');cv.getContext('2d').clearRect(0,0,600,300);S.sig=false}
  if(a==='save'){const AU=API.on(),n=AU?S.prof.name:$('#jn').value.trim();if(!n)return alert('Isi nama juri.');const foto=S.foto||S.prof.foto;if(!foto)return alert('Ambil foto wajah dengan kamera.');if(!S.sig)return alert('Tanda tangan dulu.');const role=AU?S.prof.role:(S.prof.role&&Object.values(S.scores).some(s=>s.judge===slug(S.prof.name))?S.prof.role:S.roleSel);if(!role)return alert('Pilih jenis juri: Juri K3 atau Juri Teknis.');
    S.prof={...S.prof,name:n,role,foto,ttd:$('#pad').toDataURL('image/png'),ts:Date.now(),synced:0};sv('profil',S.prof);S.foto=null;syncJuri();alert('Profil juri tersimpan.');S.tab='nilai';render()}}
async function send(){const c=calc(),p=S.prof;
  if(!p.name||!p.foto||!p.ttd){alert('Lengkapi Profil Juri (nama, foto kamera, tanda tangan) dulu.');S.tab='profil';return render()}
  if(!p.role){alert('Pilih jenis juri (K3 atau Teknis) di Profil Juri dulu.');S.tab='profil';return render()}
  if(!c.complete)return alert(`Masih ${c.need} sub aspek belum terisi (isi 0 jika tidak ada pengurangan, dan isi waktu aktual).`);
  if(S.d.fatal==='Ya'&&!confirm('Peserta ditandai DISKUALIFIKASI (nilai akhir 0). Lanjut kirim?'))return;
  const d=S.d,L=LB[S.lomba];S.busy=true;
  try{if(S.col&&!p.synced)await syncJuri();await saveDoc({role:p.role,lomba:S.lomba,mitra:S.mitra,mitraNama:CONFIG.mitra[S.mitra],judge:slug(p.name),judgeName:p.name,waktu:+d.waktu,fatal:d.fatal,khusus:+d.khusus||0,ded:d.ded,notes:d.notes,miss:Object.keys(d.miss).filter(k=>d.miss[k]),total:c.total,final:c.final,ts:Date.now()});
    clearTimeout(dt);rm('dr:'+docId());delete S.drafts[docId()];if(S.col)API.del('drafts',[docId()]).catch(()=>{});$('#sentInfo').textContent='Terkirim ✓ '+new Date().toLocaleTimeString('id-ID');fillMitra();alert('Nilai terkirim ke dashboard.')}
  catch(e){alert('Gagal mengirim: '+(e&&e.message||e))}finally{S.busy=false}}
