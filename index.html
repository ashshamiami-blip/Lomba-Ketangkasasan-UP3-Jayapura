<style>

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Barlow,system-ui,sans-serif;padding-bottom:76px}

#app{max-width:560px;margin:0 auto;padding:12px}

label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}

button{border:0;border-radius:8px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:600;min-height:42px}

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const rm=k=>{try{localStorage.removeItem(k)}catch(e){}};
const slug=s=>(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const f2=n=>(Math.round(n*100)/100).toLocaleString('id-ID');
const fixP=t=>String(t).replace(/(^|[\s:.(])-(\d)/g,'$1kurangi $2').replace(/: 0(?=\s|\.|\(|$)/g,': skor 0');
const LB=Object.fromEntries(CONFIG.lombas.map(l=>[l.id,l]));
const COL=['var(--c1)','var(--c2)','var(--c3)'];
let S={tab:'nilai',lomba:CONFIG.lombas[0].id,mitra:0,d:null,prof:ld('profil',{}),scores:{},col:null,dcol:null,drafts:{},mode:'lokal'};
const docId=()=>`${S.lomba}__${S.mitra}__${slug(S.prof.name)||'anon'}`;
const blank=()=>({waktu:'',fatal:'Tidak',khusus:0,ded:{},miss:{},notes:{},unit:'',urut:S.mitra+1});
function openDraft(){const id=docId(),ex=S.scores[id],L=ld('dr:'+id,null),R=S.drafts[id];
  const dr=L&&R?((R._t||0)>(L._t||0)?R:L):(L||R);
  S.d=dr?JSON.parse(JSON.stringify(dr)):(ex?JSON.parse(JSON.stringify(ex)):blank());
  if(Array.isArray(S.d.miss))S.d.miss=Object.fromEntries(S.d.miss.map(k=>[k,1]));delete S.d.foto;delete S.d.ttd;
  for(const k of ['ded','miss','notes'])S.d[k]=S.d[k]||{}}
let dt;function saveDraft(){const id=docId();S.d._t=Date.now();sv('dr:'+id,S.d);

function onDrafts(first){if(S.tab!=='nilai')return;const id=docId();if(first&&S.drafts[id]&&!ld('dr:'+id,null)&&!S.busy)renderNilai();else fillMitra()}
const mark=i=>{const k=`${S.lomba}__${i}__${slug(S.prof.name)||'anon'}`;return S.scores[k]?' ✓':(S.drafts[k]||ld('dr:'+k,null))?' ✎ draf':''}
const items=lb=>CONFIG.checklist.filter(c=>c.l==='*'||c.l===lb);
const pct=(lb,t)=>{for(const [b,p] of LB[lb].skala)if(t<=b)return p;return 0};

function calc(lb=S.lomba,d=S.d){
  const rub=RUBRIK[lb],cat={},pts={};
  items(lb).forEach(c=>{if(d.miss[c.n]){cat[c.k]=(cat[c.k]||0)+1;pts[c.k]=(pts[c.k]||0)+(c.pt??CONFIG.penaltyPerItem)}});
  let total=0,need=0,rows=[],asp={};
  rub.forEach((r,i)=>{let sc=null,ck=0;const mk=CONFIG.mapKategori[r.s];
    if(r.auto){if(d.waktu!==''&&d.waktu!=null)sc=r.b*pct(lb,+d.waktu)}
    else{ck=mk?(pts[mk]||0):0;const m=d.ded[i];if(m!==''&&m!=null||mk)sc=Math.max(0,r.b-(+m||0)-ck)}
    if(sc===null)need++;else total+=sc;rows.push({sc,ck});asp[r.a]=(asp[r.a]||0)+(sc||0)});
  const final=d.fatal==='Ya'?0:Math.max(0,total-(+d.khusus||0));
  return {rows,asp,total,final,need,complete:need===0,cat,pts,nmiss:Object.values(cat).reduce((a,b)=>a+b,0),ptsAll:Object.values(pts).reduce((a,b)=>a+b,0)};
}
/* ---------- timer ---------- */
const tk=()=>`tm:${S.lomba}:${S.mitra}`;
const tget=()=>ld(tk(),{run:false,start:0,acc:0});
const elapsed=t=>t.acc+(t.run?Date.now()-t.start:0);
const fmt=ms=>{const s=Math.floor(Math.abs(ms)/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
let AC,warned={};
function beep(n=1){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.value=.25;o.start(AC.currentTime+i*.3);o.stop(AC.currentTime+i*.3+.2)}navigator.vibrate&&navigator.vibrate(n*200)}catch(e){}}
function tick(){if(S.tab!=='timer')return;const t=tget(),lb=LB[S.lomba],lim=lb.batas*60000,e=elapsed(t),rem=lim-e;
  const el=$('#tbig');if(!el)return;el.textContent=(rem<0?'+':'')+fmt(rem);$('#tel').textContent='Berjalan '+fmt(e);
  const box=$('#tbox');box.className='card timer '+(rem<0?'o':rem<=300000?'w':'');
  const k=tk();if(t.run){if(rem<=300000&&rem>0&&!warned[k+'w']){warned[k+'w']=1;beep(1)}if(rem<=0&&!warned[k+'o']){warned[k+'o']=1;beep(3)}}}
setInterval(tick,250);
function tact(a){const t=tget(),k=tk();
  if(a==='go'){t.run=true;t.start=Date.now()}
  if(a==='pause'){t.acc=elapsed(t);t.run=false}
  if(a==='reset'){if(!confirm('Reset timer?'))return;t.run=false;t.acc=0;delete warned[k+'w'];delete warned[k+'o']}
  if(a==='fin'){t.acc=elapsed(t);t.run=false;sv(k,t);const m=Math.round(t.acc/600)/100;openDraft();S.d.waktu=m;saveDraft();renderTimer();alert('Waktu '+m+' menit disimpan ke lembar nilai.');return}
  sv(k,t);renderTimer()}

const API={on:()=>!!CONFIG.apiUrl,
  async get(){const r=await fetch(CONFIG.apiUrl,{cache:'no-store'});return r.json()},
  async post(o){const r=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)});const j=await r.json();if(!j.ok)throw new Error(j.err||'gagal');return j},
  set(col,id,data){return this.post({op:'set',col,id,data})},del(col,ids){return this.post({op:'del',col,ids})}};

  S.col=true;S.dcol=true;await pull();setInterval(()=>{if(!document.hidden&&!S.busy)pull()},6000)}

const head=()=>`<header class="top"><div class="logos"><img src="${LOGO_PLN}" alt="PLN"><img src="${LOGO_JAGOAN}" alt="Jagoan Jayapura"></div><div class="ttl"><h1>Penilaian Lomba Distribusi</h1><span class="badge" id="mode">${S.mode}</span></div></header>`;
function nav(){$('#nav').innerHTML=[['nilai','📝','Nilai'],['timer','⏱️','Timer'],['live','🏆','Live Score'],['profil','👤','Profil Juri']].map(([k,i,t])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}"><b>${i}</b>${t}</button>`).join('')}
function picker(){return `<div class="chips">${CONFIG.lombas.map(l=>`<button class="chip ${l.id===S.lomba?'on':''}" data-lomba="${l.id}">${esc(l.short)}</button>`).join('')}</div>
<div class="card"><b>${esc(LB[S.lomba].nama)}</b><div class="mut">Batas waktu ${LB[S.lomba].batas} menit</div><label>Mitra yang dinilai</label><select id="mitra"></select><div class="mut" style="margin-top:4px">✓ sudah dikirim · ✎ draf belum dikirim (bisa dilanjutkan)</div></div>`}
function fillMitra(){const s=$('#mitra');if(!s)return;s.innerHTML=CONFIG.mitra.map((m,i)=>`<option value="${i}" ${i===S.mitra?'selected':''}>${i+1}. ${esc(m)}${mark(i)}</option>`).join('')}
function render(){document.body.dataset.v=S.tab;nav();({nilai:renderNilai,timer:renderTimer,live:renderLive,profil:renderProfil})[S.tab]()}
function renderNilai(){
  stopCam();openDraft();const rub=RUBRIK[S.lomba],d=S.d,asps=[...new Set(rub.map(r=>r.a))];
  const sent=S.scores[docId()];
  let h=head()+(S.prof.name&&S.prof.foto&&S.prof.ttd?'':`<div class="warnbox">Lengkapi <b>Profil Juri</b> (nama, foto kamera, tanda tangan) sebelum mengirim nilai.</div>`)+picker();

    S.foto=c.toDataURL('image/jpeg',.65);const im=$('#fimg');im.src=S.foto;im.style.display='block';v.style.display='none';stopCam();$('#snap').style.display='none'}
  if(a==='clr'){const cv=$('#pad');cv.getContext('2d').clearRect(0,0,600,300);S.sig=false}
  if(a==='save'){const n=$('#jn').value.trim();if(!n)return alert('Isi nama juri.');const foto=S.foto||S.prof.foto;if(!foto)return alert('Ambil foto wajah dengan kamera.');if(!S.sig)return alert('Tanda tangan dulu.');
    S.prof={name:n,foto,ttd:$('#pad').toDataURL('image/png'),ts:Date.now()};sv('profil',S.prof);S.foto=null;syncJuri();alert('Profil juri tersimpan.');S.tab='nilai';render()}}
async function send(){const c=calc(),p=S.prof;
  if(!p.name||!p.foto||!p.ttd){alert('Lengkapi Profil Juri (nama, foto kamera, tanda tangan) dulu.');S.tab='profil';return render()}
  if(!c.complete)return alert(`Masih ${c.need} sub aspek belum terisi (isi 0 jika tidak ada pengurangan, dan isi waktu aktual).`);
  if(S.d.fatal==='Ya'&&!confirm('Peserta ditandai DISKUALIFIKASI (nilai akhir 0). Lanjut kirim?'))return;
  const d=S.d,L=LB[S.lomba];S.busy=true;
  try{if(S.col&&!p.synced)await syncJuri();await saveDoc({lomba:S.lomba,mitra:S.mitra,mitraNama:CONFIG.mitra[S.mitra],judge:slug(p.name),judgeName:p.name,waktu:+d.waktu,fatal:d.fatal,khusus:+d.khusus||0,ded:d.ded,notes:d.notes,miss:Object.keys(d.miss).filter(k=>d.miss[k]),total:c.total,final:c.final,ts:Date.now()});
    clearTimeout(dt);rm('dr:'+docId());delete S.drafts[docId()];if(S.col)API.del('drafts',[docId()]).catch(()=>{});$('#sentInfo').textContent='Terkirim ✓ '+new Date().toLocaleTimeString('id-ID');fillMitra();alert('Nilai terkirim ke dashboard.')}
  catch(e){alert('Gagal mengirim: '+(e&&e.message||e))}finally{S.busy=false}}
/* ---------- event ---------- */
document.addEventListener('click',e=>{const rk=e.target.closest('[data-m]');if(rk){S.detail=+rk.dataset.m;scrollTo(0,0);return renderLive()}const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='demo'){S.demo=!S.demo;if(S.demo&&!S.demoScores)S.demoScores=makeDemo();S.detail=null;return renderLive()}
  if(b.dataset.act==='back'){S.detail=null;return renderLive()}
  if(b.dataset.act==='admin')return adminOpen();
  if(b.dataset.act==='admback'){S.tab='profil';return render()}
  if(b.dataset.adm)return admAct(b.dataset.adm,b.dataset.v);
  if(b.dataset.tab){S.tab=b.dataset.tab;S.detail=null;return render()}
  if(b.dataset.lomba){S.lomba=b.dataset.lomba;return render()}
  if(b.dataset.t)return tact(b.dataset.t);
  if(b.dataset.p)return pact(b.dataset.p);
  if(b.dataset.zero){const i=b.dataset.zero,v=RUBRIK[S.lomba][i].b;$(`[data-ded="${i}"]`).value=v;S.d.ded[i]=v;return upd()}
  if(b.dataset.st){const i=b.dataset.st,inp=$(`[data-ded="${i}"]`);inp.value=Math.max(0,(+inp.value||0)+ +b.dataset.n);S.d.ded[i]=inp.value;return upd()}
  const seg=b.closest('[data-chk]');if(seg){S.d.miss[seg.dataset.chk]=b.dataset.v==='1';$$('button',seg).forEach(x=>x.classList.toggle('on',x===b));return upd()}
  if(b.closest('#fatal')){S.d.fatal=b.dataset.v;$$('#fatal button').forEach(x=>x.classList.toggle('on',x===b));return upd()}
  if(b.dataset.act==='timer'){const t=tget(),m=Math.round(elapsed(t)/600)/100;if(!m)return alert('Timer belum dijalankan untuk mitra ini.');S.d.waktu=m;$('[data-f="waktu"]').value=m;return upd()}
  if(b.dataset.act==='zero'){RUBRIK[S.lomba].forEach((r,i)=>{if(!r.auto&&(S.d.ded[i]===''||S.d.ded[i]==null))S.d.ded[i]=0;});$$('[data-ded]').forEach(x=>{if(x.value==='')x.value=0});return upd()}
  if(b.dataset.act==='send')return send()});
document.addEventListener('input',e=>{const t=e.target;if(!S.d)return;
  if(t.dataset.f){S.d[t.dataset.f]=t.value;return upd()}
  if(t.dataset.ded!==undefined){S.d.ded[t.dataset.ded]=t.value;return upd()}
  if(t.dataset.note!==undefined){S.d.notes[t.dataset.note]=t.value;saveDraft()}});
document.addEventListener('change',e=>{if(e.target.id==='mitra'){S.mitra=+e.target.value;render()}});
render();initDb();
